<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const v = localStorage.getItem("isg-lang");
          if (v && ["tr","en","de","fr","ar","ru"].includes(v)) {
            document.documentElement.lang = v;
            if (v === "ar") document.documentElement.dir = "rtl";
          }
        } catch (_) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Üyelik Başvurusu — İSG Pusulası</title>
    <meta name="description" content="Demo ve üyelik başvurusu." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://isg-tanitim-web-kvfsvqx7na-ew.a.run.app/basvuru.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="İSG Pusulası" />
    <meta property="og:title" content="Üyelik Başvurusu — İSG Pusulası" />
    <meta property="og:description" content="Demo ve üyelik başvurusu." />
    <meta property="og:url" content="https://isg-tanitim-web-kvfsvqx7na-ew.a.run.app/basvuru.html" />
    <meta property="og:image" content="https://isg-tanitim-web-kvfsvqx7na-ew.a.run.app/img/app_logo.png" />
    <meta name="theme-color" content="#06101f" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/css/main.css" />
    
  </head>
  <body class="antialiased" data-page="apply">
    <div data-site-chrome></div>
    <main>

      <section class="page-hero">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
          <p class="text-sm font-bold uppercase tracking-[0.2em] text-sky-soft" data-i18n="apply.eyebrow"></p>
          <h1 class="mt-3 font-display text-4xl font-extrabold sm:text-5xl" data-i18n="apply.title"></h1>
          <p class="mt-4 max-w-2xl text-lg text-slate-300" data-i18n="apply.sub"></p>
        </div>
      </section>

      <section id="basvuru" class="py-16 sm:py-20">
        <div class="mx-auto grid max-w-7xl gap-10 px-4 lg:grid-cols-[0.9fr_1.1fr] sm:px-6 lg:px-8">
          <div data-reveal>
            <div class="rounded-xl border border-navy/10 bg-navy/[0.03] p-4 text-sm leading-relaxed text-ink/80">
              <p class="font-semibold text-navy" data-i18n="apply.noteTitle"></p>
              <p class="mt-1.5" data-i18n="apply.noteBody"></p>
            </div>
          </div>
          <form id="apply-form" class="soft-card p-6 sm:p-8" data-reveal="right" novalidate>
            <div class="grid gap-4 sm:grid-cols-2">
              <label class="block sm:col-span-2"><span class="mb-1.5 block text-sm font-medium text-navy" data-i18n="apply.name"></span><input class="form-input" name="adSoyad" type="text" autocomplete="name" required data-i18n-placeholder="apply.phName" /></label>
              <label class="block"><span class="mb-1.5 block text-sm font-medium text-navy" data-i18n="apply.email"></span><input class="form-input" name="email" type="email" autocomplete="email" required data-i18n-placeholder="apply.phEmail" /></label>
              <label class="block"><span class="mb-1.5 block text-sm font-medium text-navy" data-i18n="apply.phone"></span><input class="form-input" name="telefon" type="tel" autocomplete="tel" data-i18n-placeholder="apply.phPhone" /></label>
              <label class="block"><span class="mb-1.5 block text-sm font-medium text-navy" data-i18n="apply.city"></span><input class="form-input" name="sehir" type="text" data-i18n-placeholder="apply.phCity" /></label>
              <label class="block"><span class="mb-1.5 block text-sm font-medium text-navy" data-i18n="apply.platform"></span>
                <select class="form-input" name="platform">
                  <option value="both" data-i18n="apply.platformBoth"></option>
                  <option value="windows" data-i18n="apply.platformWin"></option>
                  <option value="android" data-i18n="apply.platformAnd"></option>
                </select>
              </label>
              <label class="block sm:col-span-2"><span class="mb-1.5 block text-sm font-medium text-navy" data-i18n="apply.message"></span><textarea class="form-input min-h-28 resize-y" name="mesaj" rows="4" data-i18n-placeholder="apply.phMessage"></textarea></label>
            </div>
            <button type="submit" class="btn-amber mt-6 w-full sm:w-auto" data-i18n="apply.submit"></button>
            <p id="apply-status" class="mt-4" hidden role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>

    </main>
    <footer class="site-footer" data-site-footer></footer>
    
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
