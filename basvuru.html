<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const v = localStorage.getItem("isg-lang");
          if (v && ["tr","en","de","fr","ar","ru"].includes(v)) {
            document.documentElement.lang = v;
            if (v === "ar") document.documentElement.dir = "rtl";
          }
        } catch (_) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satın Al — İSG Atlası</title>
    <meta name="description" content="İSG Atlası satın alın — Windows Agent + Mobil birlikte. 3 PC kurulum hakkı dahil." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://isgatlasi.com/basvuru.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="İSG Atlası" />
    <meta property="og:title" content="Satın Al — İSG Atlası" />
    <meta property="og:description" content="İSG Atlası satın alın — Windows Agent + Mobil birlikte." />
    <meta property="og:url" content="https://isgatlasi.com/basvuru.html" />
    <meta property="og:image" content="https://isgatlasi.com/img/app_logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#06101f" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/css/main.css" />
  </head>
  <body class="antialiased" data-page="apply">
    <div data-site-chrome></div>
    <main>

      <section class="page-hero apply-hero">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
          <p class="text-sm font-bold uppercase tracking-[0.2em] text-sky-soft" data-i18n="apply.eyebrow"></p>
          <h1 class="mt-3 font-display text-4xl font-extrabold sm:text-5xl" data-i18n="apply.title"></h1>
          <p class="mt-4 max-w-2xl text-lg text-slate-300" data-i18n="apply.sub"></p>
        </div>
      </section>

      <section id="basvuru" class="apply-section">
        <div class="mx-auto grid max-w-7xl gap-8 px-4 lg:grid-cols-[0.92fr_1.08fr] sm:px-6 lg:px-8">
          <div class="apply-info-stack" data-reveal>
            <article class="apply-info-card apply-info-card--amber">
              <div class="apply-info-icon apply-info-icon--svg" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7A2.5 2.5 0 0 1 17.5 16H13l-3.2 3.2c-.5.5-1.3.15-1.3-.55V16H6.5A2.5 2.5 0 0 1 4 13.5v-7Z" stroke="currentColor" stroke-width="1.7"/><path d="M8 9h8M8 12h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              </div>
              <h2 class="apply-info-title" data-i18n="apply.noteTitle"></h2>
              <p class="apply-info-body" data-i18n="apply.noteBody"></p>
            </article>
            <article class="apply-info-card apply-info-card--sky">
              <div class="apply-info-icon apply-info-icon--svg" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"><path d="M7 16a4 4 0 0 1 .4-7.98A5.5 5.5 0 0 1 18 10.5c0 .17 0 .34-.02.5A3.5 3.5 0 0 1 18 18H7.5A3.5 3.5 0 0 1 7 16Z" stroke="currentColor" stroke-width="1.7"/></svg>
              </div>
              <h2 class="apply-info-title" data-i18n="apply.card2Title"></h2>
              <p class="apply-info-body" data-i18n="apply.card2Body"></p>
            </article>
            <article class="apply-info-card apply-info-card--emerald">
              <div class="apply-info-icon apply-info-icon--svg" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"><path d="M12 3 5 6.5v5.2c0 4.1 2.7 7.8 7 8.8 4.3-1 7-4.7 7-8.8V6.5L12 3Z" stroke="currentColor" stroke-width="1.7"/><path d="m9.2 12.2 1.9 1.9 3.8-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
              <h2 class="apply-info-title" data-i18n="apply.card3Title"></h2>
              <p class="apply-info-body" data-i18n="apply.card3Body"></p>
            </article>

            <figure class="apply-expert-band">
              <div class="apply-expert-band-media">
                <img src="/img/apply/isg-uzman-tek.png" alt="İSG uzmanı" width="320" height="400" loading="lazy" />
              </div>
              <figcaption data-i18n="apply.expertCaption">İSG uzmanlarının tek tercihi</figcaption>
            </figure>
          </div>

          <form id="apply-form" class="apply-form" data-reveal="right" novalidate autocomplete="off">
            <div class="apply-form-head">
              <div class="apply-form-badge apply-form-badge--svg" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"><path d="M7 3.75h7.5L19 8.25v12A1.75 1.75 0 0 1 17.25 22H7A1.75 1.75 0 0 1 5.25 20.25V5.5A1.75 1.75 0 0 1 7 3.75Z" stroke="currentColor" stroke-width="1.7"/><path d="M14.5 3.8V8H19M8.5 12.5h7M8.5 16h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              </div>
              <h2 class="apply-form-title" data-i18n="apply.formTitle">Satın Alma Formu</h2>
            </div>

            <div class="apply-form-grid apply-form-grid--paket">
              <label class="apply-field apply-field--full">
                <span class="apply-label">
                  <span class="apply-label-left">
                    <span class="apply-label-ico apply-label-ico--amber" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16v12H4V7Zm3-3h10v3H7V4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span>
                    <span data-i18n="apply.package">Paket</span>
                  </span>
                </span>
                <select class="apply-input" name="paket" required autocomplete="off">
                  <option value="" data-i18n="apply.phPackage">Paket seçin…</option>
                  <option value="max">Max — ₺27.000 / yıl · KDV dahil</option>
                  <option value="kurumsal">Kurumsal — 5+ kullanıcı · KDV dahil</option>
                </select>
              </label>

              <div class="apply-field apply-field--full" data-seats-wrap hidden>
                <label class="apply-field">
                  <span class="apply-label">
                    <span class="apply-label-left">
                      <span class="apply-label-ico apply-label-ico--sky" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M16 11a3 3 0 1 0-3-3 3 3 0 0 0 3 3ZM8 12a3 3 0 1 0-3-3 3 3 0 0 0 3 3Zm8 2c-2.2 0-4 1.3-4 3v1h8v-1c0-1.7-1.8-3-4-3ZM8 14c-2.5 0-4.5 1.4-4.5 3.2V19H10v-1.8C10 15.4 9.2 14.5 8 14Z" stroke="currentColor" stroke-width="1.5"/></svg></span>
                      <span data-i18n="apply.seats">Kullanıcı Sayısı</span>
                    </span>
                  </span>
                  <input class="apply-input" name="kullaniciSayisi" type="number" min="5" step="1" value="5" autocomplete="off" />
                </label>
                <p class="apply-seats-hint" data-seats-hint>Minimum 5 kullanıcı · birim fiyat × adet · KDV dahil</p>
              </div>
            </div>

            <div class="apply-paket-summary" data-paket-summary hidden>
              <div class="apply-paket-summary-media" data-paket-media>
                <img src="/img/apply/isg-uzman-tek.png" alt="" data-paket-img width="160" height="200" />
              </div>
              <div class="apply-paket-summary-body">
                <div class="apply-paket-summary-label" data-i18n="apply.selectedPackage">Seçilen Paket</div>
                <div class="apply-paket-summary-title" data-paket-title>—</div>
                <div class="apply-paket-summary-price" data-paket-price>—</div>
                <div class="apply-paket-summary-vat" data-i18n="apply.vatIncluded">KDV dahil</div>
                <div class="apply-paket-summary-scope" data-paket-scope></div>
              </div>
            </div>

            <div class="apply-form-grid">
              <label class="apply-field">
                <span class="apply-label">
                  <span class="apply-label-left">
                    <span class="apply-label-ico apply-label-ico--violet" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 19.2c1.6-3 4-4.5 6.5-4.5s4.9 1.5 6.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
                    <span data-i18n="apply.name"></span>
                  </span>
                  <span class="apply-counter" data-name-chars>0/40</span>
                </span>
                <input class="apply-input" name="adSoyad" type="text" required maxlength="40" autocomplete="off" data-lpignore="true" data-form-type="other" data-i18n-placeholder="apply.phName" />
              </label>

              <label class="apply-field">
                <span class="apply-label">
                  <span class="apply-label-left">
                    <span class="apply-label-ico apply-label-ico--rose" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="3.5" width="16" height="17" rx="2.2" stroke="currentColor" stroke-width="1.7"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
                    <span data-i18n="apply.identity">TC Kimlik</span>
                  </span>
                </span>
                <input class="apply-input" name="kimlikNo" type="text" inputmode="numeric" required maxlength="11" pattern="[1-9][0-9]{10}" autocomplete="off" data-lpignore="true" data-form-type="other" data-i18n-placeholder="apply.phIdentity" placeholder="11 haneli TC" />
              </label>

              <label class="apply-field">
                <span class="apply-label">
                  <span class="apply-label-left">
                    <span class="apply-label-ico apply-label-ico--sky" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Z" stroke="currentColor" stroke-width="1.7"/><path d="m5.5 7.5 6.5 5 6.5-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                    <span data-i18n="apply.email"></span>
                  </span>
                </span>
                <input class="apply-input" name="email" type="email" required maxlength="120" autocomplete="off" data-lpignore="true" data-form-type="other" data-i18n-placeholder="apply.phEmail" />
              </label>

              <label class="apply-field">
                <span class="apply-label">
                  <span class="apply-label-left">
                    <span class="apply-label-ico apply-label-ico--emerald" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M8.2 4.8 10 7.2c.3.4.2 1-.2 1.3L8.5 9.5c1.3 2.6 3.4 4.7 6 6l1-1.3c.3-.4.9-.5 1.3-.2l2.4 1.8c.5.4.6 1.1.2 1.6l-1.1 1.4c-.4.5-1 .8-1.6.7-5.3-.8-9.6-5.1-10.4-10.4-.1-.6.2-1.2.7-1.6l1.4-1.1c.5-.4 1.2-.3 1.6.2Z" stroke="currentColor" stroke-width="1.6"/></svg></span>
                    <span data-i18n="apply.phone"></span>
                  </span>
                  <span class="apply-counter" data-phone-chars>0/10</span>
                </span>
                <input class="apply-input" name="telefon" type="tel" inputmode="numeric" required maxlength="10" pattern="5[0-9]{9}" autocomplete="off" data-lpignore="true" data-form-type="other" data-i18n-placeholder="apply.phPhone" />
              </label>

              <label class="apply-field">
                <span class="apply-label">
                  <span class="apply-label-left">
                    <span class="apply-label-ico apply-label-ico--amber" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="10" r="2.4" stroke="currentColor" stroke-width="1.7"/></svg></span>
                    <span data-i18n="apply.city"></span>
                  </span>
                </span>
                <select class="apply-input" name="sehir" required autocomplete="off"></select>
              </label>

              <label class="apply-field">
                <span class="apply-label">
                  <span class="apply-label-left">
                    <span class="apply-label-ico apply-label-ico--sky" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 19h16M6 19V9l6-4 6 4v10" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 19v-5h4v5" stroke="currentColor" stroke-width="1.7"/></svg></span>
                    <span data-i18n="apply.district">İlçe</span>
                  </span>
                </span>
                <select class="apply-input" name="ilce" required disabled autocomplete="off">
                  <option value="" data-i18n="apply.phDistrict">İlçe seçin…</option>
                </select>
              </label>

              <input type="hidden" name="platform" value="windows_android" />

              <label class="apply-field apply-field--full">
                <span class="apply-label">
                  <span class="apply-label-left">
                    <span class="apply-label-ico apply-label-ico--violet" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span>
                    <span data-i18n="apply.address">Adres</span>
                  </span>
                </span>
                <textarea class="apply-input apply-textarea apply-textarea--address" name="adres" rows="3" required maxlength="200" autocomplete="off" data-lpignore="true" data-form-type="other" data-i18n-placeholder="apply.phAddress"></textarea>
              </label>

              <label class="apply-field apply-field--full">
                <span class="apply-label">
                  <span class="apply-label-left">
                    <span class="apply-label-ico apply-label-ico--slate" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5.5h14v13H5v-13Z" stroke="currentColor" stroke-width="1.7"/><path d="M8 9h8M8 12.5h8M8 16h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
                    <span data-i18n="apply.message"></span>
                  </span>
                  <span class="apply-counter" data-msg-words>0/40</span>
                </span>
                <textarea class="apply-input apply-textarea" name="mesaj" rows="3" maxlength="280" autocomplete="off" data-i18n-placeholder="apply.phMessage"></textarea>
              </label>
            </div>

            <label class="apply-hp" aria-hidden="true">
              <span>Website</span>
              <input type="text" name="website" tabindex="-1" autocomplete="off" />
            </label>

            <div class="apply-turnstile-wrap" data-turnstile-wrap>
              <div class="apply-turnstile-head">
                <span class="apply-label-ico apply-label-ico--emerald" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3 5 6.5v5.2c0 4.1 2.7 7.8 7 8.8 4.3-1 7-4.7 7-8.8V6.5L12 3Z" stroke="currentColor" stroke-width="1.7"/></svg></span>
                <span data-i18n="apply.captchaTitle">Güvenlik Doğrulaması</span>
              </div>
              <div class="apply-turnstile" data-turnstile-slot></div>
              <p class="apply-turnstile-hint" data-turnstile-hint data-i18n="apply.captchaHint">Robot olmadığınızı doğrulayın.</p>
            </div>

            <p class="apply-pay-hint">
              <span class="apply-pay-hint-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="7" width="17" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 11h17M8 15h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
              <span data-i18n="apply.payHint">Devam’da güvenli iyzico ödeme sayfasına yönlendirilirsiniz.</span>
            </p>

            <div class="apply-form-actions">
              <button type="submit" class="btn-amber apply-submit" data-i18n="apply.submitPay">Ödemeye Geç</button>
            </div>
          </form>
        </div>
      </section>

    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
