<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const v = localStorage.getItem("isg-lang");
          if (v && ["tr","en","de","fr","ar","ru"].includes(v)) {
            document.documentElement.lang = v;
            if (v === "ar") document.documentElement.dir = "rtl";
          }
        } catch (_) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Üyelik Başvurusu — İSG Atlası</title>
    <meta name="description" content="Demo ve üyelik başvurusu." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://isgatlasi.com/basvuru.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="İSG Atlası" />
    <meta property="og:title" content="Üyelik Başvurusu — İSG Atlası" />
    <meta property="og:description" content="Demo ve üyelik başvurusu." />
    <meta property="og:url" content="https://isgatlasi.com/basvuru.html" />
    <meta property="og:image" content="https://isgatlasi.com/img/app_logo.png" />
    <meta name="theme-color" content="#06101f" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/css/main.css" />
  </head>
  <body class="antialiased" data-page="apply">
    <div data-site-chrome></div>
    <main>

      <section class="page-hero apply-hero">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
          <p class="text-sm font-bold uppercase tracking-[0.2em] text-sky-soft" data-i18n="apply.eyebrow"></p>
          <h1 class="mt-3 font-display text-4xl font-extrabold sm:text-5xl" data-i18n="apply.title"></h1>
          <p class="mt-4 max-w-2xl text-lg text-slate-300" data-i18n="apply.sub"></p>
        </div>
      </section>

      <section id="basvuru" class="apply-section">
        <div class="mx-auto grid max-w-7xl gap-8 px-4 lg:grid-cols-[0.92fr_1.08fr] sm:px-6 lg:px-8">
          <div class="apply-info-stack" data-reveal>
            <article class="apply-info-card apply-info-card--amber">
              <div class="apply-info-icon" aria-hidden="true">💻</div>
              <h2 class="apply-info-title" data-i18n="apply.noteTitle"></h2>
              <p class="apply-info-body" data-i18n="apply.noteBody"></p>
            </article>
            <article class="apply-info-card apply-info-card--sky">
              <div class="apply-info-icon" aria-hidden="true">☁️</div>
              <h2 class="apply-info-title" data-i18n="apply.card2Title"></h2>
              <p class="apply-info-body" data-i18n="apply.card2Body"></p>
            </article>
            <article class="apply-info-card apply-info-card--emerald">
              <div class="apply-info-icon" aria-hidden="true">🛡️</div>
              <h2 class="apply-info-title" data-i18n="apply.card3Title"></h2>
              <p class="apply-info-body" data-i18n="apply.card3Body"></p>
            </article>
          </div>

          <form id="apply-form" class="apply-form" data-reveal="right" novalidate>
            <div class="apply-form-head">
              <div class="apply-form-badge" aria-hidden="true">📝</div>
              <h2 class="apply-form-title" data-i18n="apply.formTitle">Başvuru Formu</h2>
            </div>

            <div class="apply-form-grid">
              <label class="apply-field apply-field--full">
                <span class="apply-label">
                  <span data-i18n="apply.name"></span>
                  <span class="apply-counter" data-name-words>0/4</span>
                </span>
                <input class="apply-input" name="adSoyad" type="text" autocomplete="name" required maxlength="60" data-i18n-placeholder="apply.phName" />
              </label>
              <label class="apply-field">
                <span class="apply-label" data-i18n="apply.email"></span>
                <input class="apply-input" name="email" type="email" autocomplete="email" required maxlength="120" data-i18n-placeholder="apply.phEmail" />
              </label>
              <label class="apply-field">
                <span class="apply-label" data-i18n="apply.phone"></span>
                <input class="apply-input" name="telefon" type="tel" inputmode="numeric" autocomplete="tel" required maxlength="10" pattern="[5][0-9]{9}" data-i18n-placeholder="apply.phPhone" />
              </label>
              <label class="apply-field">
                <span class="apply-label" data-i18n="apply.city"></span>
                <select class="apply-input" name="sehir" required></select>
              </label>
              <label class="apply-field">
                <span class="apply-label" data-i18n="apply.platform"></span>
                <select class="apply-input" name="platform" required>
                  <option value="windows_android" data-i18n="apply.platformWinAnd"></option>
                  <option value="windows_ios" data-i18n="apply.platformWinIos"></option>
                  <option value="macos_android" data-i18n="apply.platformMacAnd"></option>
                  <option value="macos_ios" data-i18n="apply.platformMacIos"></option>
                  <option value="linux_android" data-i18n="apply.platformLinAnd"></option>
                  <option value="linux_ios" data-i18n="apply.platformLinIos"></option>
                </select>
              </label>
              <label class="apply-field apply-field--full">
                <span class="apply-label">
                  <span data-i18n="apply.message"></span>
                  <span class="apply-counter" data-msg-words>0/80</span>
                </span>
                <textarea class="apply-input apply-textarea" name="mesaj" rows="4" maxlength="800" data-i18n-placeholder="apply.phMessage"></textarea>
              </label>
            </div>

            <label class="apply-hp" aria-hidden="true">
              <span>Website</span>
              <input type="text" name="website" tabindex="-1" autocomplete="off" />
            </label>

            <div class="apply-turnstile" data-turnstile-slot></div>

            <div class="apply-form-actions">
              <button type="submit" class="btn-amber apply-submit" data-i18n="apply.submit"></button>
            </div>
          </form>
        </div>
      </section>

    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
