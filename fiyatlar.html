<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const v = localStorage.getItem("isg-lang");
          if (v && ["tr","en","de","fr","ar","ru"].includes(v)) {
            document.documentElement.lang = v;
            if (v === "ar") document.documentElement.dir = "rtl";
          }
        } catch (_) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fiyatlandırma — İSG Atlası Bireysel Lisans</title>
    <meta name="description" content="Normal, Pro ve Max bireysel İSG Atlası lisans paketleri ve güncel liste fiyatları." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://isgatlasi.com/fiyatlar.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="İSG Atlası" />
    <meta property="og:title" content="Fiyatlandırma — İSG Atlası" />
    <meta property="og:description" content="Bireysel lisans paketleri ve liste fiyatları." />
    <meta property="og:url" content="https://isgatlasi.com/fiyatlar.html" />
    <meta property="og:image" content="https://isgatlasi.com/img/app_logo.png" />
    <meta name="theme-color" content="#06101f" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/css/main.css" />
  </head>
  <body class="antialiased" data-page="pricing">
    <div data-site-chrome></div>
    <main id="pricing-page">

      <section class="page-hero">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
          <p class="text-sm font-bold uppercase tracking-[0.2em] text-sky-soft" data-i18n="pricing.eyebrow"></p>
          <h1 class="mt-3 font-display text-4xl font-extrabold sm:text-5xl" data-i18n="pricing.title"></h1>
          <p class="mt-4 max-w-2xl text-lg text-slate-300" data-i18n="pricing.sub"></p>
        </div>
      </section>

      <section class="py-12 sm:py-16">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
          <section class="pricing-panel" data-reveal>
            <div class="pricing-panel-head">
              <h2 class="pricing-panel-title">Bireysel Lisans Paketleri</h2>
              <span class="pricing-panel-meta">Yıllık liste fiyatları · KDV dahil</span>
            </div>
            <div class="packages-grid" id="pricing-packages-grid">
              <p class="text-slate-500 col-span-full text-center py-8">Paketler yükleniyor…</p>
            </div>
          </section>

          <div class="mt-10 text-center">
            <a href="/basvuru.html" class="btn-amber inline-flex">Üyelik Başvurusu Yap</a>
          </div>
        </div>
      </section>

    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
