<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const v = localStorage.getItem("isg-lang");
          if (v && ["tr","en","de","fr","ar","ru"].includes(v)) {
            document.documentElement.lang = v;
            if (v === "ar") document.documentElement.dir = "rtl";
          }
        } catch (_) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>İndir — Windows, Android, iOS</title>
    <meta name="description" content="İSG Atlası indirme." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://isgatlasi.com/indir.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="İSG Atlası" />
    <meta property="og:title" content="İndir — Windows, Android, iOS" />
    <meta property="og:description" content="İSG Atlası indirme." />
    <meta property="og:url" content="https://isgatlasi.com/indir.html" />
    <meta property="og:image" content="https://isgatlasi.com/img/app_logo.png" />
    <meta name="theme-color" content="#06101f" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/css/main.css" />
    
  </head>
  <body class="antialiased" data-page="download">
    <div data-site-chrome></div>
    <main>

      <section class="page-hero">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
          <p class="text-sm font-bold uppercase tracking-[0.2em] text-sky-soft" data-i18n="download.eyebrow"></p>
          <h1 class="mt-3 font-display text-4xl font-extrabold sm:text-5xl" data-i18n="download.title"></h1>
          <p class="mt-4 max-w-2xl text-lg text-slate-300" data-i18n="download.sub"></p>
        </div>
      </section>

      <section id="indir" class="bg-navy py-16 text-white sm:py-20">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
          <p id="download-notes" class="text-lg text-slate-300" data-i18n="download.sub"></p>
          <div class="mt-10 grid gap-6 md:grid-cols-3">
            <div class="rounded-2xl border border-white/10 bg-white/5 p-7" data-reveal>
              <h3 class="text-lg font-bold" data-i18n="download.winTitle"></h3>
              <p class="mt-2 text-sm text-slate-300" data-i18n="download.winDesc"></p>
              <div id="os-badge-windows" class="mt-3 flex flex-wrap gap-2"></div>
              <button id="download-windows" onclick="openEmailGate('windows')" type="button" class="btn-amber mt-6" data-i18n="download.winBtn"></button>
            </div>
            <div class="rounded-2xl border border-white/10 bg-white/5 p-7" data-reveal>
              <h3 class="text-lg font-bold" data-i18n="download.andTitle"></h3>
              <p class="mt-2 text-sm text-slate-300" data-i18n="download.andDesc"></p>
              <div id="os-badge-android" class="mt-3 flex flex-wrap gap-2"></div>
              <button id="download-android" onclick="openEmailGate('android')" type="button" class="btn-ghost-light mt-6" data-i18n="download.andBtn"></button>
              <div class="mt-5 flex flex-wrap gap-3">
                <a id="store-play" href="#" class="store-btn" aria-label="Google Play">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3.6 2.3c-.4.2-.6.6-.6 1.1v17.2c0 .5.2.9.6 1.1l.1.1 9.6-9.6v-.3L3.7 2.2l-.1.1zm12.1 7L12.5 12l3.2 2.7 3.8-2.2c.7-.4.7-1.1 0-1.5l-3.8-2.7zM12.1 12.5l-9.7 9.7c.2.1.4.1.6.1.3 0 .6-.1.9-.3l10.7-6.2-2.5-3.3zm2.5-5.1L4 2.2C3.7 2 3.4 2 3.1 2c-.2 0-.4 0-.6.1l9.6 9.6 2.5-2.3z"/></svg>
                  <span class="text-left leading-tight"><span class="block text-[10px] uppercase opacity-70" data-i18n="download.play"></span><span class="block text-sm font-semibold" data-store-label data-i18n="download.soon"></span></span>
                </a>
                <a id="store-apple" href="#" class="store-btn" aria-label="App Store">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M18.7 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.9-3.5.9s-1.8-.8-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.3 2.9 2.3 1.1 0 1.6-.7 3-.7s1.8.7 3 .7 2-1.1 2.8-2.2c.9-1.3 1.2-2.5 1.3-2.6-.1 0-2.4-.9-2.5-3.7zM15.8 5.5c.6-.8 1.1-1.8.9-2.9-1 .1-2.1.6-2.8 1.4-.6.7-1.2 1.8-1 2.8 1.1.1 2.2-.5 2.9-1.3z"/></svg>
                  <span class="text-left leading-tight"><span class="block text-[10px] uppercase opacity-70" data-i18n="download.appstore"></span><span class="block text-sm font-semibold" data-store-label data-i18n="download.soon"></span></span>
                </a>
              </div>
            </div>
            <div class="rounded-2xl border border-white/10 bg-white/5 p-7" data-reveal>
              <h3 class="text-lg font-bold" data-i18n="download.iosTitle"></h3>
              <p class="mt-2 text-sm text-slate-300" data-i18n="download.iosDesc"></p>
              <div id="os-badge-ios" class="mt-3 flex flex-wrap gap-2"></div>
              <button id="download-ios" onclick="openEmailGate('ios')" type="button" class="btn-ghost-light mt-6" data-i18n="download.iosBtn"></button>
            </div>
          </div>
          <p class="mt-8 text-center text-sm text-slate-400" data-i18n="download.limitNote"></p>
        </div>
      </section>

    </main>
    <footer class="site-footer" data-site-footer></footer>
    
    <div id="email-gate-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;align-items:center;justify-content:center;" role="dialog" aria-modal="true">
      <div style="background:#0f172a;border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:32px;width:min(420px,92vw);">
        <h2 style="font-size:20px;font-weight:800;color:#f8fafc;margin-bottom:8px;" data-i18n="download.gateTitle"></h2>
        <p style="font-size:14px;color:#94a3b8;margin-bottom:20px;" data-i18n="download.gateText"></p>
        <input type="email" id="gate-email" data-i18n-placeholder="apply.phEmail" style="width:100%;padding:12px 14px;background:#1e293b;border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:#f8fafc;font-size:14px;box-sizing:border-box;margin-bottom:12px;" autocomplete="email" />
        <div id="gate-msg" style="font-size:13px;color:#f59e0b;min-height:20px;margin-bottom:12px;"></div>
        <div style="display:flex;gap:10px;justify-content:flex-end;">
          <button onclick="closeEmailGate()" type="button" style="padding:10px 18px;border-radius:10px;background:#1e293b;border:1px solid rgba(255,255,255,0.12);color:#94a3b8;font-size:13px;font-weight:600;cursor:pointer;" data-i18n="download.gateCancel"></button>
          <button id="gate-btn" onclick="submitEmailGate()" type="button" style="padding:10px 20px;border-radius:10px;background:#f59e0b;border:none;color:#0a0e1a;font-size:13px;font-weight:700;cursor:pointer;" data-i18n="download.gateSubmit"></button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
